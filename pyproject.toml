[project]
name = "tenant-access-lab"
version = "0.1.0"
description = "Tenant-scoped APIs with FastAPI and PostgreSQL: live membership checks, composite constraints, optimistic concurrency and IDOR tests."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kyrylo Prolieiev"}]
dependencies = [
    'fastapi>=0.115',
    'uvicorn>=0.34',
    'psycopg[binary]>=3.2',
    'PyJWT>=2.10',
    "httpx2>=2.15.1",
]

[project.scripts]
lab = "tenant_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
